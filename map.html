<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MicroMonde — Carte des fresques</title>
    <!-- Page carte independante de l'AR (index.html) : pas de scripts 8th Wall ici,
         le moteur n'est charge qu'au passage sur le scan. Memes polices que index.html
         (voir DA.md). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Quicksand:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <!-- Lien general vers le scan AR (index.html) : la fresque est reconnue par
         l'image target, pas par le marqueur choisi. -->
    <a id="map-scan-btn" href="./">Scanner une fresque</a>

    <footer id="map-credits" class="credits credits--map"></footer>
    <!-- Recentrage sur la position de l'utilisateur : cache tant que la
         geolocalisation n'a pas renvoye de position (voir watchUserPosition
         dans src/map/map.ts). Remplace les boutons +/- : zoom au pincement. -->
    <button id="map-locate-btn" hidden aria-label="Me localiser">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="26" stroke="currentColor" stroke-width="6"/>
        <circle cx="50" cy="50" r="9" fill="currentColor"/>
        <line x1="50" y1="8" x2="50" y2="24" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <line x1="50" y1="76" x2="50" y2="92" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <line x1="8" y1="50" x2="24" y2="50" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        <line x1="76" y1="50" x2="92" y2="50" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </button>

    <script type="module" src="/src/map/map.ts"></script>
  </body>
</html>
